version: '3.9'

services:

  postgres:
    image: postgres:15-alpine
    container_name: acrla-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: acrla
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acrla-backend
    ports:
      - "8000:8000"
    environment:
      # LLM provider selection (see backend/.env.example for the full list).
      # Gemini is the default; set the matching *_API_KEY for whichever
      # provider LLM_PROVIDER selects. No real key belongs in this file --
      # export these in your shell or put them in a root-level .env that
      # docker-compose reads automatically (see README > Configuration).
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-not-needed}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-not-needed}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-not-needed}
      - CEREBRAS_MODEL=${CEREBRAS_MODEL:-gpt-oss-120b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-not-needed}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      # host.docker.internal reaches an Ollama instance running on the host
      # machine (Docker Desktop); "localhost" from inside this container
      # would mean the container itself, not the host.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3:mini}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/acrla
      - CHROMA_PATH=/app/chroma_db
      - SECRET_KEY=${SECRET_KEY:-changeme}
      - MOODLE_URL=${MOODLE_URL:-http://moodle:8080}
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000
      - MAX_RETRIEVAL_CHUNKS=${MAX_RETRIEVAL_CHUNKS:-5}
      - ACRLA_AGENT_MODE=${ACRLA_AGENT_MODE:-simple}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  moodle:
    image: bitnamilegacy/moodle:4.3
    container_name: acrla-moodle
    ports:
      - "8080:8080"
    environment:
      - MOODLE_DATABASE_HOST=postgres
      - MOODLE_DATABASE_PORT_NUMBER=5432
      - MOODLE_DATABASE_USER=postgres
      - MOODLE_DATABASE_PASSWORD=password
      - MOODLE_DATABASE_NAME=moodle
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=admin123
      - MOODLE_EMAIL=admin@example.com
      - MOODLE_SITE_NAME=ACRLA Demo
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
      - ./moodle_plugin/acrla:/bitnami/moodle/local/acrla

volumes:
  pg_data:
  chroma_data:
  moodle_data:
  moodledata_data:
